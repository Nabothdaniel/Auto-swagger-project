name: Feature request
description: Suggest a scanner, schema, or configuration improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to document today without manual annotations?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example input
      description: A route and TypeScript types that should work after this change.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Desired OpenAPI output
      render: json
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
