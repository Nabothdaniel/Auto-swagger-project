name: Conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  naming:
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      BRANCH_NAME: ${{ github.head_ref }}

    steps:
      - name: Check pull request title
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\((scanner|schema|watcher|ui|types|deps|ci|docs|release)\))?!?: [^ ].{0,90}$'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "Pull request title must follow Conventional Commits, for example:"
            echo "  fix(scanner): resolve routes registered through nested routers"
            echo "See CONTRIBUTING.md for the allowed types and scopes."
            exit 1
          fi

      - name: Check branch name
        run: |
          pattern='^((feat|fix|docs|refactor|perf|test|ci|chore)/[a-z0-9]+(-[a-z0-9]+)*|release/v[0-9]+\.[0-9]+\.[0-9]+|dependabot/.+)$'
          if ! printf '%s' "$BRANCH_NAME" | grep -Eq "$pattern"; then
            echo "Branch name must look like <type>/<short-description>, for example:"
            echo "  fix/42-nullable-union-schema"
            echo "See CONTRIBUTING.md for the allowed types."
            exit 1
          fi
